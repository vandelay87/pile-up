[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
exclude_filter="test/*, tools/*, addons/gdUnit4/*, reports/*"
export_path="build/windows/pile-up.exe"

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false

[preset.1]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
exclude_filter="test/*, tools/*, addons/gdUnit4/*, reports/*"
export_path="build/macos/pile-up.zip"

[preset.1.options]

binary_format/architecture="universal"
application/bundle_identifier="dev.akli.pileup"
codesign/codesign=1
notarization/notarization=0
