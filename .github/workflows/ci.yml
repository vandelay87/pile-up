name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.7.2"

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install gdtoolkit==4.5.0
      - run: gdlint src test tools
      - run: gdformat --check src test tools
      - run: tools/check_sim_boundary_test.sh

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: godot-gdunit-labs/gdUnit4-action@17eeffa988f9732fdc3dba3067405d16b55809de # v1.3.2
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          version: installed
          paths: res://test

  export:
    name: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - run: godot --headless --import
      - run: mkdir -p build/windows build/macos
      - run: godot --headless --export-release "Windows Desktop" build/windows/pile-up.exe
      - run: godot --headless --export-release "macOS" build/macos/pile-up.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pile-up-windows
          path: build/windows/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pile-up-macos
          path: build/macos/pile-up.zip
          retention-days: 7
          if-no-files-found: error
